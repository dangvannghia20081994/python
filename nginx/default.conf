upstream music_app {
    server app:8765;
}

server {
    listen 80;
    listen [::]:80;
    server_name music.nip.io music.10.9.17.80.nip.io localhost;

    client_max_body_size 10m;

    access_log /var/log/nginx/music.access.log;
    error_log  /var/log/nginx/music.error.log;

    location / {
        proxy_pass         http://music_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # /api/stream returns 302 to googlevideo — let browser follow it directly
        proxy_redirect     off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
