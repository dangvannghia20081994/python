services:
  app:
    build: .
    container_name: music-app
    restart: unless-stopped
    expose:
      - "8765"
    networks:
      - music-net

  nginx:
    image: nginx:1.27-alpine
    container_name: music-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - music-net

  ngrok:
    image: ngrok/ngrok:latest
    container_name: music-ngrok
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "--url=these-cadet-unaired.ngrok-free.dev"
      - "--pooling-enabled"
      - "nginx:80"
    ports:
      - "4040:4040"
    depends_on:
      - nginx
    networks:
      - music-net

networks:
  music-net:
    driver: bridge
