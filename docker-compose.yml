services:
  app:
    build: .
    container_name: music-app
    restart: unless-stopped
    environment:
      # Served under /music behind the shared gateway (gateway/Caddyfile routes /music → here).
      BASE_PATH: /music
    # Bind to localhost only — the shared Caddy gateway (127.0.0.1:8080) reverse-proxies to this port.
    ports:
      - "127.0.0.1:5300:8765"
